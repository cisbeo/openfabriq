      /* The landing page's light theme (packages/docs/app/global.css). */
      :root {
        --ground: oklch(0.984 0.0015 264);
        --panel: oklch(1 0 0);
        --sunken: oklch(0.966 0.003 264);
        --line: oklch(0.919 0.004 264);
        --ink: hsl(0, 0%, 3.9%);
        --muted: hsl(0, 0%, 38%);
        --accent: oklch(0.5 0.19 262);
        --accent-soft: oklch(0.54 0.19 262 / 0.08);
        --accent-line: oklch(0.54 0.19 262 / 0.3);
        --ok: oklch(0.55 0.13 152);
        --ok-soft: oklch(0.55 0.13 152 / 0.1);
        --warn: oklch(0.51 0.12 66);
        --warn-soft: oklch(0.7 0.14 80 / 0.14);
        --shadow-small: 0 4px 12px -4px oklch(0.2 0.02 264 / 0.1), 0 1px 2px oklch(0.2 0.02 264 / 0.06);
        --shadow: 0 24px 48px -16px oklch(0.2 0.02 264 / 0.18), 0 4px 12px -4px oklch(0.2 0.02 264 / 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      /* A faint dot grid and a blue glow at the top: the ground every scene sits on. */
      #ground {
        position: absolute;
        inset: 0;
        background-color: var(--ground);
        background-image:
          radial-gradient(1400px 800px at 50% 0%, rgba(37, 87, 207, 0.06), transparent 70%),
          radial-gradient(circle at 1px 1px, rgba(10, 10, 10, 0.07) 1px, transparent 0);
        background-size:
          auto,
          32px 32px;
      }
    </style>

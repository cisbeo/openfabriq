  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(
      "#studio-window",
      { opacity: 0, y: 30, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
      0.05,
    );
    // Each screen as the voice names it (scene 11's clip starts at 0.3 s). Every screen shows the
    // whole app, its menu and breadcrumb with it, at 1.2 (the window's width), so each reads as
    // the studio; the camera only follows the page down a little.
    // A frame is [x, y, scale, dx]: the page point at the view's top-left corner, screen pixels
    // per page pixel, and an optional shift right. [layer, from, to, start, end]
    const shots = [
      ["board", [0, 0, 1.2], [0, 24, 1.2], 0.05, 2.1],
      ["run", [0, 0, 1.2], [0, 24, 1.2], 2.1, 3.7],
      ["wiki", [0, 0, 1.2], [0, 150, 1.2], 3.7, 6.2],
      ["chat", [0, 0, 1.2], [0, 24, 1.2], 6.2, 10.2],
    ];
    // An optional fourth number moves the page right on the screen: a frame narrower than the view, centred.
    const frame = ([x, y, s, dx = 0]) => ({ x: dx - x * s, y: -y * s, scale: s });
    shots.forEach(([key, from, to, start, end], i) => {
      const cam = `#cam-${key}`;
      // A short dip between screens: the last one leaves before the next comes, never both at once.
      if (i > 0) tl.to(`#cam-${shots[i - 1][0]}`, { opacity: 0, duration: 0.15, ease: "power2.in" }, start - 0.05);
      if (i === 0) tl.to(cam, { opacity: 1, duration: 0.01 }, start);
      else tl.fromTo(cam, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, start + 0.1);
      // A slow move of the camera while the screen holds: a push in, or down the page.
      tl.fromTo(cam, frame(from), { ...frame(to), duration: end - start + 0.4, ease: "sine.inOut" }, start);
    });
    // "every run": the reviewer in its chain; "and its cost".
    tl.fromTo("#mark-reviewer", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.5);
    tl.fromTo("#mark-cost", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.0);
    const captions = [0.4, 2.1, 3.7, 6.2, 8.0];
    captions.forEach((t, i) => {
      const id = `#studio-caption-${i + 1}`;
      tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, t);
      const next = captions[i + 1];
      if (next !== undefined) tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, next - 0.15);
    });
    // "Even from Claude Code": the studio steps back, a Claude Code session asks the same question.
    tl.to("#studio-window", { scale: 0.96, opacity: 0.35, filter: "blur(4px)", duration: 0.5, ease: "power2.inOut" }, 7.75);
    tl.fromTo(
      "#studio-claude",
      { opacity: 0, y: 50, filter: "blur(8px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
      7.8,
    );
    tl.fromTo("#claude-ask", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "steps(38)" }, 8.15);
    tl.fromTo("#claude-tool", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 8.85);
    tl.fromTo("#claude-answer-1", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 9.15);
    tl.fromTo("#claude-answer-2", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 9.3);
    tl.to("#studio-window, #studio-claude, #studio-caption-5", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 9.95);
    window.__timelines["studio"] = tl;
  </script>

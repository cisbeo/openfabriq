name: Webflow to Astro migration
description: Moves a Webflow site to an Astro site in your own repository, page template by page template, and proves each page against the published Webflow site. Editors keep working in Webflow until the switch; humans settle the decisions, merge, and move the domain.
repository: acme/example-astro
maintainers: [alice]
model: sonnet
timezone: Europe/Paris

setup: pnpm install --frozen-lockfile

commands:
  build: pnpm build
  test: pnpm test
  export: scripts/webflow-export.sh # the CMS and the files it points to, through Webflow's API, into webflow-export/
  import: pnpm run import # webflow-export/ into the site's content; a script of the site, which the migration's first ticket (T01) writes as skills/astro-conventions says
  parity: pnpm parity # compares the Webflow and the Astro pages; a script of the site, which the migration's first ticket (T01) writes too
checks: [build, test] # parity reads the published Webflow site: agents run it themselves

env:
  ASTRO_TELEMETRY_DISABLED: "1" # Astro sends no usage data; the network would refuse it anyway
  LEGACY_SITE_URL: https://example.webflow.io # the published Webflow site, on its webflow.io address
  WEBFLOW_SITE_ID: 0123456789abcdef01234567 # Site settings > General > Site ID
secrets: [WEBFLOW_API_TOKEN] # a site token with read scopes only: an agent that edits code could read it through a command

network: # the sites agents and commands reach
  - packages # the package registries, and GitHub
  - api.webflow.com # the export script
  - example.webflow.io # the published site of LEGACY_SITE_URL
  - "*.website-files.com" # the files the CMS points to
  - uploads-ssl.webflow.com
  # What a published Webflow page loads, for the old site's screenshots: jQuery, the font loader, Google Fonts
  - d3e54v103j8qbb.cloudfront.net
  - ajax.googleapis.com
  - fonts.googleapis.com
  - fonts.gstatic.com

limits:
  usd_per_run: 8
  usd_per_day: 40
  minutes_per_run: 60
  review_rounds: 3 # rounds of internal review before a person takes over
answer_mentions: true # the agents that open pull requests answer a maintainer's @openfabriq in a comment on them; false turns it off

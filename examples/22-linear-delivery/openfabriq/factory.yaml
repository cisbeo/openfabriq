name: Linear delivery factory
description: The team plans and hands work over in Linear. A label asks for an implementation plan in the issue; assigning the issue to openfabriq gets a pull request, linked in the issue's session. A human reviews and merges on GitHub.
repository: acme/web-app
maintainers: [alice]
model: sonnet

integrations:
  linear:
    team: ENG # the key of the Linear team whose issues the factory reads

setup: pnpm install --frozen-lockfile

# The harness: the engine runs the checks before the implementer's pull request leaves.
commands:
  test: pnpm test
  lint: pnpm lint
checks: [test, lint]

limits:
  usd_per_run: 5
  usd_per_day: 30
  minutes_per_run: 45
answer_mentions: true # the agents that open pull requests answer a maintainer's @openfabriq in a comment on them; false turns it off
